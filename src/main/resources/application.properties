server.port=5000

# ========================================================
# HOT STORAGE: Supabase (PostgreSQL) / Local Fallback
# ========================================================
spring.datasource.url=${SUPABASE_DB_URL:jdbc:sqlite:chat.db}
spring.datasource.driver-class-name=${SUPABASE_DB_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${SUPABASE_DB_USER:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.jpa.database-platform=${SUPABASE_DB_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ========================================================
# COLD STORAGE: Discord Media & Attachment Store
# ========================================================
# Set your Discord channel Webhook URL here or via DISCORD_WEBHOOK_URL env var:
# Example: https://discord.com/api/webhooks/1234567890/abcdef...
app.storage.discord.webhook-url=${DISCORD_WEBHOOK_URL:}
app.storage.discord.enabled=${DISCORD_STORAGE_ENABLED:true}

# Multipart File Upload Settings
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Application Custom Properties
app.jwt.secret=vndfkgvbfdcfdsgnerughertuhfgvndvifvhuhgterfjerfvnrughughefenveogjrtugntlfvfnlkmvfeirgnrtnhyunbjgfnriejfrgrtjhnbgjlnvfilvkmevirgbnylnmibglkmfdvfjndmvsrogb
app.jwt.expiration-ms=86400000
app.upload.dir=uploads

# ========================================================
# AI DRAWING ASSISTANT (Groq & OpenRouter)
# ========================================================
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.model=${OPENROUTER_MODEL:openrouter/free}

