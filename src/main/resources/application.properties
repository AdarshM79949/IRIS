server.port=5000

# ========================================================
# HOT STORAGE: Supabase (PostgreSQL) / Local Fallback
# ========================================================
spring.datasource.url=${SUPABASE_DB_URL:${SUPABASE_URL:${DATABASE_URL:${DB_URL:jdbc:sqlite:chat.db}}}}
spring.datasource.username=${SUPABASE_DB_USER:${SUPABASE_USER:${DB_USER:postgres}}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${SUPABASE_PASSWORD:${DB_PASS:}}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

